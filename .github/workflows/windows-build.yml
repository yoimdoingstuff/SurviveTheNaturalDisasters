name: Windows build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run map importer tests
        run: python -m unittest discover -s tools/map_importer -p "test_*.py" -v

      - name: Configure (CMake)
        run: cmake -S . -B build -G "Visual Studio 18 2026" -A x64

      - name: Build (Release)
        run: cmake --build build --config Release

      - name: Run native CTest suite
        run: ctest --test-dir build -C Release --output-on-failure

      # Proves the runtime actually boots (window + main loop + shutdown),
      # not just that it compiles. --smoke-test makes it exit on its own
      # after 60 frames instead of waiting for input.
      - name: Smoke test the runtime
        shell: cmd
        run: build\Release\nds_runtime.exe --smoke-test 60

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nds_runtime-windows
          path: build/Release/nds_runtime.exe
