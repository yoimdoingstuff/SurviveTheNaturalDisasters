name: Fix world helper order

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add world helper prototype
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('engine/src/content/map_loader.c')
          s=p.read_text(encoding='utf-8')
          needle='static void free_entries(map_entry* entries,size_t count)'
          if 'static void add_world_shell(nds_instance* root);' not in s:
              s=s.replace(needle,'static void add_world_shell(nds_instance* root);\n'+needle,1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/src/content/map_loader.c
          git commit -m "Fix island world helper declaration" || true
          git push
