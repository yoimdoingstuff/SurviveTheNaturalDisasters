name: Debug UI world patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  debug:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose patch stages
        run: |
          set +e
          python3 - <<'PY' > tools/patch_debug.txt 2>&1
          import importlib.util, traceback
          spec=importlib.util.spec_from_file_location('p','tools/apply_ui_world_patch.py')
          p=importlib.util.module_from_spec(spec); spec.loader.exec_module(p)
          p.MARK='__FORCED_DEBUG_MARK__'
          for name, fn in [('header',p.patch_header),('app',p.patch_app),('backend',p.patch_backend),('world',p.patch_world_loader)]:
              print('STAGE', name)
              try:
                  fn(); print('OK')
              except Exception as e:
                  print(type(e).__name__, str(e)); traceback.print_exc(); break
          PY
          cat tools/patch_debug.txt
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/patch_debug.txt
          git commit -m "Record UI world patch diagnostics"
          git push
