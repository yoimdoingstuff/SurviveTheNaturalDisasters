name: Add initialization crash markers

on:
  push:
    branches: [ main ]

jobs:
  diagnostics:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Add initialization markers
        shell: pwsh
        run: |
          $path = 'engine/src/core/app.c'
          $text = Get-Content -Raw -Encoding UTF8 $path
          $text = $text.Replace('}else NDS_LOGI(TAG,"smoke test mode: rendering disabled; exercising engine/game systems only");nds_clock_init(&clock);nds_perf_reset();while(!platform_quit_requested()){', '}else NDS_LOGI(TAG,"smoke test mode: rendering disabled; exercising engine/game systems only");NDS_LOGI(TAG,"init marker: before clock_init");nds_clock_init(&clock);NDS_LOGI(TAG,"init marker: after clock_init");NDS_LOGI(TAG,"init marker: before perf_reset");nds_perf_reset();NDS_LOGI(TAG,"init marker: after perf_reset");NDS_LOGI(TAG,"init marker: before main loop");while(!platform_quit_requested()){')
          Set-Content -Path $path -Value $text -Encoding UTF8 -NoNewline
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 18 2026" -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Smoke test
        shell: cmd
        run: build\Release\nds_runtime.exe --smoke-test 180
      - name: Remove temporary workflow and commit markers
        shell: pwsh
        run: |
          Remove-Item -Force '.github/workflows/add-init-logging.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@github.com'
          git add engine/src/core/app.c .github/workflows/add-init-logging.yml
          git commit -m 'Add runtime initialization diagnostics'
          git push
