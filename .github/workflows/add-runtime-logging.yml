name: Add runtime diagnostics

on:
  push:
    branches: [ main ]

jobs:
  diagnostics:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch persistent runtime logger
        shell: pwsh
        run: |
          $path = 'engine/src/core/app.c'
          $text = Get-Content -Raw -Encoding UTF8 $path
          $marker = 'static const char* TAG="app";'
          $logger = @'
static FILE* g_runtime_debug_log=NULL;
static void runtime_debug_open(void){g_runtime_debug_log=fopen("runtime_debug.log","ab");if(g_runtime_debug_log){fprintf(g_runtime_debug_log,"\\n=== runtime start ===\\n");fflush(g_runtime_debug_log);}}
static void runtime_debug(const char* message){if(g_runtime_debug_log&&message){fprintf(g_runtime_debug_log,"%s\\n",message);fflush(g_runtime_debug_log);}}
'@
          if(-not $text.Contains($marker)){throw 'app marker not found'}
          $text = $text.Replace($marker, $logger + "`n" + $marker)
          $text = $text.Replace('if(!options)return NDS_ERR_INVALID_ARG;rc=platform_init();', 'if(!options)return NDS_ERR_INVALID_ARG;runtime_debug_open();runtime_debug("stage: before platform_init");rc=platform_init();runtime_debug("stage: platform_init returned");')
          $text = $text.Replace('rc=platform_create_window(&win_desc);if(rc!=NDS_OK){', 'runtime_debug("stage: before platform_create_window");rc=platform_create_window(&win_desc);runtime_debug("stage: platform_create_window returned");if(rc!=NDS_OK){')
          $text = $text.Replace('{size_t initial_map=nds_map_catalog_select(1);const char* initial_path=', 'runtime_debug("stage: before initial scene load");{size_t initial_map=nds_map_catalog_select(1);const char* initial_path=')
          $text = $text.Replace('rc=load_startup_scene(initial_path,mesh_cache,texture_cache,&scene);}if(rc!=NDS_OK)goto cleanup_texture;', 'rc=load_startup_scene(initial_path,mesh_cache,texture_cache,&scene);runtime_debug("stage: initial scene load returned");}if(rc!=NDS_OK)goto cleanup_texture;')
          $text = $text.Replace('rc=nds_physics_add_scene(&physics,scene);if(rc!=NDS_OK)goto cleanup_scene;', 'runtime_debug("stage: before initial physics scene add");rc=nds_physics_add_scene(&physics,scene);runtime_debug("stage: initial physics scene add returned");if(rc!=NDS_OK)goto cleanup_scene;')
          $text = $text.Replace('rc=nds_gles2_renderer_create(&renderer,&render_desc);if(rc!=NDS_OK)goto cleanup_scene;', 'runtime_debug("stage: before renderer_create");rc=nds_gles2_renderer_create(&renderer,&render_desc);runtime_debug("stage: renderer_create returned");if(rc!=NDS_OK)goto cleanup_scene;')
          $text = $text.Replace('while(!platform_quit_requested()){double dt;', 'runtime_debug("stage: entering main loop");while(!platform_quit_requested()){double dt;')
          $text = $text.Replace('if(round.state!=previous_round_state){if(round.state==NDS_ROUND_PLAYING){', 'if(round.state!=previous_round_state){runtime_debug("stage: round state changed");if(round.state==NDS_ROUND_PLAYING){')
          $text = $text.Replace('if(map_path){nds_instance* next_scene=NULL;nds_result map_rc=load_startup_scene(map_path,mesh_cache,texture_cache,&next_scene);', 'if(map_path){runtime_debug("stage: starting round scene load");nds_instance* next_scene=NULL;nds_result map_rc=load_startup_scene(map_path,mesh_cache,texture_cache,&next_scene);runtime_debug("stage: round scene load returned");')
          $text = $text.Replace('if(map_rc==NDS_OK&&next_scene){nds_physics_clear(&physics);', 'if(map_rc==NDS_OK&&next_scene){runtime_debug("stage: swapping round scene");nds_physics_clear(&physics);')
          $text = $text.Replace('if(!smoke_mode){int window_width=0,window_height=0;', 'if(!smoke_mode){if(frames_run<10||round.state==NDS_ROUND_PLAYING){runtime_debug("stage: render frame");}int window_width=0,window_height=0;')
          $text = $text.Replace('frames_run++;if(smoke_mode&&frames_run>=(unsigned long)smoke_frames)platform_request_quit();', 'frames_run++;if((frames_run%60u)==0u){char debug_frame[128];snprintf(debug_frame,sizeof(debug_frame),"frame=%lu round_state=%d menu=%d player_alive=%d",frames_run,(int)round.state,menu_active,player.alive);runtime_debug(debug_frame);}if(smoke_mode&&frames_run>=(unsigned long)smoke_frames)platform_request_quit();')
          Set-Content -Path $path -Value $text -Encoding UTF8 -NoNewline
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 18 2026" -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Smoke test
        shell: cmd
        run: build\Release\nds_runtime.exe --smoke-test 180
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: runtime-diagnostics
          path: |
            runtime_debug.log
            build/Release/nds_runtime.exe
      - name: Commit logger and remove temporary workflow
        shell: pwsh
        run: |
          Remove-Item -Force '.github/workflows/add-runtime-logging.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@github.com'
          git add engine/src/core/app.c .github/workflows/add-runtime-logging.yml
          git commit -m 'Add persistent runtime crash diagnostics'
          git push
