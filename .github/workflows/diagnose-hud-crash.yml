name: Diagnose HUD runtime crash

on:
  push:
    branches: [ main ]

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Add HUD crash diagnostics
        shell: pwsh
        run: |
          $path = 'engine/src/render/gles2_backend.c'
          $text = Get-Content -Raw -Encoding UTF8 $path
          $old = 'size_t quads=0,text_quads=0;vertices=(nds_hud_vertex*)malloc(max_quads*4*sizeof(*vertices));'
          $new = 'size_t quads=0,text_quads=0;NDS_LOGI("gles2","HUD: entered draw_hud, allocating buffers");vertices=(nds_hud_vertex*)malloc(max_quads*4*sizeof(*vertices));'
          if (-not $text.Contains($old)) { throw 'allocation marker not found' }
          $text = $text.Replace($old,$new)
          $old = 'if(!vertices||!indices||!text_vertices||!text_indices){free(vertices);free(indices);free(text_vertices);free(text_indices);return NDS_ERR_UNKNOWN;}'
          $new = 'if(!vertices||!indices||!text_vertices||!text_indices){NDS_LOGE("gles2","HUD: allocation failed");free(vertices);free(indices);free(text_vertices);free(text_indices);return NDS_ERR_UNKNOWN;}NDS_LOGI("gles2","HUD: buffers allocated");'
          if (-not $text.Contains($old)) { throw 'allocation check marker not found' }
          $text = $text.Replace($old,$new)
          $old = 'if(!b||!state)return NDS_ERR_INVALID_ARG;'
          $new = 'if(!b||!state)return NDS_ERR_INVALID_ARG;NDS_LOGI("gles2","HUD: valid backend/state");'
          if (-not $text.Contains($old)) { throw 'state check marker not found' }
          $old = 'b->gl.glUniform1i(b->use_texture_uniform,0);if(state->menu_active){'
          $new = 'b->gl.glUniform1i(b->use_texture_uniform,0);NDS_LOGI("gles2","HUD: entering menu branch");if(state->menu_active){'
          if (-not $text.Contains($old)) { throw 'menu branch marker not found' }
          $text = $text.Replace($old,$new)
          $old = 'hud_quad(vertices,indices,&quads,0,0,w,h);'
          $new = 'NDS_LOGI("gles2","HUD: menu geometry start");hud_quad(vertices,indices,&quads,0,0,w,h);'
          if (-not $text.Contains($old)) { throw 'menu geometry marker not found' }
          $text = $text.Replace($old,$new)
          $old = 'hud_draw_batch(b,vertices,indices,quads,0.015f,0.025f,0.045f,0.90f);'
          $new = 'NDS_LOGI("gles2","HUD: drawing menu background quads=%zu",quads);hud_draw_batch(b,vertices,indices,quads,0.015f,0.025f,0.045f,0.90f);NDS_LOGI("gles2","HUD: menu background drawn");'
          if (-not $text.Contains($old)) { throw 'background draw marker not found' }
          $text = $text.Replace($old,$new)
          $old = 'text_quads=0;hud_text(text_vertices,text_indices,&text_quads,px+42,py+34,s,"NATURAL DISASTER SURVIVAL");'
          $new = 'text_quads=0;NDS_LOGI("gles2","HUD: building menu text");hud_text(text_vertices,text_indices,&text_quads,px+42,py+34,s,"NATURAL DISASTER SURVIVAL");'
          if (-not $text.Contains($old)) { throw 'text marker not found' }
          $text = $text.Replace($old,$new)
          $old = 'hud_text(text_vertices,text_indices,&text_quads,px+48,py+448,1.1f,"M MENU");hud_draw_batch(b,text_vertices,text_indices,text_quads,0.88f,0.96f,1.0f,0.96f);'
          $new = 'hud_text(text_vertices,text_indices,&text_quads,px+48,py+448,1.1f,"M MENU");NDS_LOGI("gles2","HUD: drawing menu text quads=%zu",text_quads);hud_draw_batch(b,text_vertices,text_indices,text_quads,0.88f,0.96f,1.0f,0.96f);NDS_LOGI("gles2","HUD: menu text drawn");'
          if (-not $text.Contains($old)) { throw 'text draw marker not found' }
          $text = $text.Replace($old,$new)
          Set-Content -Path $path -Value $text -Encoding UTF8 -NoNewline
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 18 2026" -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Native tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Commit diagnostics
        shell: pwsh
        run: |
          Remove-Item -Force '.github/workflows/diagnose-hud-crash.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@github.com'
          git add engine/src/render/gles2_backend.c .github/workflows/diagnose-hud-crash.yml
          git commit -m 'Add HUD runtime diagnostics'
          git push
