name: Fix round transition regression

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix scene transition lifetime order
        shell: pwsh
        run: |
          $path = 'engine/src/core/app.c'
          $text = Get-Content -Raw -Encoding UTF8 $path
          $old = 'nds_instance_destroy(scene);scene=next_scene;nds_physics_clear(&physics);nds_physics_add_scene(&physics,scene);'
          $new = 'nds_physics_clear(&physics);nds_instance_destroy(scene);scene=next_scene;if(nds_physics_add_scene(&physics,scene)!=NDS_OK){nds_instance_destroy(scene);scene=NULL;}else{'
          if (-not $text.Contains($old)) { throw 'Expected unsafe scene transition sequence was not found' }
          $text = $text.Replace($old, $new)
          $text = $text.Replace('nds_player_init(&player,scene);nds_player_attach_visual(&player,scene);nds_player_update_visual(&player,scene);nds_player_apply_camera(&player,&camera);constrain_third_person_camera(&camera,&player,&physics);}}elimination_logged=0;', 'nds_player_init(&player,scene);nds_player_attach_visual(&player,scene);nds_player_update_visual(&player,scene);nds_player_apply_camera(&player,&camera);constrain_third_person_camera(&camera,&player,&physics);}}}elimination_logged=0;', 1)
          Set-Content -Path $path -Value $text -Encoding UTF8 -NoNewline

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 18 2026" -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Native tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Long smoke test through round transition
        shell: cmd
        run: build\Release\nds_runtime.exe --smoke-test 900

      - name: Upload fixed runtime
        uses: actions/upload-artifact@v4
        with:
          name: nds-runtime-round-transition-fix
          path: build/Release/nds_runtime.exe

      - name: Commit fix and remove temporary workflow
        shell: pwsh
        run: |
          Remove-Item -Force '.github/workflows/fix-round-transition.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@github.com'
          git add engine/src/core/app.c .github/workflows/fix-round-transition.yml
          git commit -m 'Fix round transition scene lifetime'
          git push
