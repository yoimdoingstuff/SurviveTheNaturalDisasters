name: Force UI and world patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply force patch
        run: |
          python3 - <<'PY'
          import importlib.util
          spec = importlib.util.spec_from_file_location('patcher', 'tools/apply_ui_world_patch.py')
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          mod.MARK = '__FORCED_UI_WORLD_PATCH_APPLIED__'
          mod.patch_header()
          mod.patch_app()
          mod.patch_backend()
          mod.patch_world_loader()
          print('forced patch applied')
          PY
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/include/engine/render/gles2.h engine/src/core/app.c engine/src/render/gles2_backend.c engine/src/content/map_loader.c
          git diff --cached --stat
          git commit -m "Implement visual menu, text HUD, map selection, and island water"
          git push
