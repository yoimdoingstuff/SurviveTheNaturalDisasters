name: Repair runtime render shutdown

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch renderer error handling
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('engine/src/core/app.c')
          s = p.read_text(encoding='utf-8')
          old = 'if(rc==NDS_OK)rc=nds_gles2_renderer_end(renderer);if(rc!=NDS_OK)platform_request_quit();'
          new = 'if(rc==NDS_OK)rc=nds_gles2_renderer_end(renderer);if(rc!=NDS_OK){NDS_LOGE(TAG,"renderer frame failed (%d); skipping frame instead of closing",(int)rc);rc=NDS_OK;}'
          if old not in s:
              raise SystemExit('runtime render shutdown pattern not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Remove temporary workflow and commit patch
        shell: bash
        run: |
          rm -f .github/workflows/repair-runtime-render.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add engine/src/core/app.c .github/workflows/repair-runtime-render.yml
          git commit -m 'Keep runtime alive when a render frame fails'
          git push
