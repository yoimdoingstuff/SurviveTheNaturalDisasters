name: Fix HUD stack allocation

on:
  push:
    branches: [ main ]

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch HUD heap allocation
        shell: pwsh
        run: |
          $path = 'engine/src/render/gles2_backend.c'
          $text = Get-Content -Raw -Encoding UTF8 $path
          $old = 'nds_result nds_gles2_backend_draw_hud(nds_gles2_backend* b,const nds_hud_state* state){nds_hud_vertex vertices[8192*4];GLushort indices[8192*6];nds_hud_vertex text_vertices[8192*4];GLushort text_indices[8192*6];size_t quads=0,text_quads=0;'
          $new = 'nds_result nds_gles2_backend_draw_hud(nds_gles2_backend* b,const nds_hud_state* state){const size_t max_quads=8192u;nds_hud_vertex* vertices=NULL;GLushort* indices=NULL;nds_hud_vertex* text_vertices=NULL;GLushort* text_indices=NULL;size_t quads=0,text_quads=0;vertices=(nds_hud_vertex*)malloc(max_quads*4*sizeof(*vertices));indices=(GLushort*)malloc(max_quads*6*sizeof(*indices));text_vertices=(nds_hud_vertex*)malloc(max_quads*4*sizeof(*text_vertices));text_indices=(GLushort*)malloc(max_quads*6*sizeof(*text_indices));if(!vertices||!indices||!text_vertices||!text_indices){free(vertices);free(indices);free(text_vertices);free(text_indices);return NDS_ERR_UNKNOWN;}'
          if (-not $text.Contains($old)) { throw 'HUD stack allocation pattern not found' }
          $text = $text.Replace($old,$new)
          $oldEnd = 'b->gl.glUniform1i(b->use_texture_uniform,0);return NDS_OK;}'
          $newEnd = 'b->gl.glUniform1i(b->use_texture_uniform,0);free(vertices);free(indices);free(text_vertices);free(text_indices);return NDS_OK;}'
          if (-not $text.Contains($oldEnd)) { throw 'HUD return pattern not found' }
          $text = $text.Replace($oldEnd,$newEnd,1)
          Set-Content -Path $path -Value $text -Encoding UTF8 -NoNewline
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 18 2026" -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Native tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Long runtime smoke test
        shell: cmd
        run: build\Release\nds_runtime.exe --smoke-test 900
      - name: Commit fix and remove workflow
        shell: pwsh
        run: |
          Remove-Item -Force '.github/workflows/fix-hud-stack.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@github.com'
          git add engine/src/render/gles2_backend.c .github/workflows/fix-hud-stack.yml
          git commit -m 'Fix HUD stack overflow'
          git push
