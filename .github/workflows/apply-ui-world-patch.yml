name: Apply UI and world patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply patch
        id: apply
        continue-on-error: true
        run: |
          python3 tools/apply_ui_world_patch.py > patch_error.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            cp patch_error.log tools/patch_error.txt
            cat patch_error.log
          fi
          exit $status
      - name: Commit patched sources and diagnostics
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f tools/patch_error.txt ]; then git add tools/patch_error.txt; fi
          git add engine/include/engine/render/gles2.h engine/src/core/app.c engine/src/render/gles2_backend.c engine/src/content/map_loader.c tools/apply_ui_world_patch.py .github/workflows/apply-ui-world-patch.yml
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Implement visual menu, text HUD, map selection, and island water"
          git push
      - name: Fail when patch did not apply
        if: steps.apply.outcome == 'failure'
        run: exit 1
